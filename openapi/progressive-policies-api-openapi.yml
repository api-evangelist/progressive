openapi: 3.2.0
info:
  title: Progressive Certificate of Insurance Policies API
  description: The Progressive Certificate of Insurance API provides programmatic access to generate and manage certificates of insurance for commercial policyholders. This API enables partners and agents to automate the certificate issuance process and manage proof of insurance documentation.
  version: '1.0'
servers:
- url: https://api.progressive.com
tags:
- name: Policies
  description: Retrieve policy information for certificate generation.
paths:
  /policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Retrieves a list of active policies eligible for certificate generation.
      tags:
      - Policies
      responses:
        '200':
          description: Success
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
