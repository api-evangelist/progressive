naftiko: 1.0.0-alpha2
info:
  label: Progressive Certificate of Insurance API — Policies
  description: 'Progressive Certificate of Insurance API — Policies. 1 operations. Lead operation: List policies. Self-contained
    Naftiko capability covering one Progressive business surface.'
  tags:
  - Progressive
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PROGRESSIVE_API_KEY: PROGRESSIVE_API_KEY
capability:
  consumes:
  - type: http
    namespace: certificate-of-insurance-policies
    baseUri: https://api.progressive.com
    description: Progressive Certificate of Insurance API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listpolicies
        method: GET
        description: List policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PROGRESSIVE_API_KEY}}'
  exposes:
  - type: rest
    namespace: certificate-of-insurance-policies-rest
    port: 8080
    description: REST adapter for Progressive Certificate of Insurance API — Policies. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/policies
      name: policies
      description: REST surface for policies.
      operations:
      - method: GET
        name: listpolicies
        description: List policies
        call: certificate-of-insurance-policies.listpolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: certificate-of-insurance-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Progressive Certificate of Insurance API — Policies. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-policies
      description: List policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: certificate-of-insurance-policies.listpolicies
      outputParameters:
      - type: object
        mapping: $.
