naftiko: 1.0.0-alpha2
info:
  label: Progressive Auto Quote API
  description: The Progressive Auto Quote API enables partners to embed auto insurance quoting capabilities directly into
    their applications. Partners can return estimated auto insurance rates with customizable options including SDK and headless
    API integration. The API supports both non-production and production environments for testing and live deployments.
  tags:
  - Progressive
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: progressive
    baseUri: https://api.progressive.com
    description: Progressive Auto Quote API HTTP API.
    authentication:
      type: bearer
      token: '{{PROGRESSIVE_TOKEN}}'
    resources:
    - name: quotes
      path: /quotes
      operations:
      - name: listquotes
        method: GET
        description: List quotes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createquote
        method: POST
        description: Create a quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vehicles
      path: /vehicles
      operations:
      - name: listvehicles
        method: GET
        description: List vehicles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: drivers
      path: /drivers
      operations:
      - name: listdrivers
        method: GET
        description: List drivers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: progressive-rest
    description: REST adapter for Progressive Auto Quote API.
    resources:
    - path: /quotes
      name: listquotes
      operations:
      - method: GET
        name: listquotes
        description: List quotes
        call: progressive.listquotes
        outputParameters:
        - type: object
          mapping: $.
    - path: /quotes
      name: createquote
      operations:
      - method: POST
        name: createquote
        description: Create a quote
        call: progressive.createquote
        outputParameters:
        - type: object
          mapping: $.
    - path: /vehicles
      name: listvehicles
      operations:
      - method: GET
        name: listvehicles
        description: List vehicles
        call: progressive.listvehicles
        outputParameters:
        - type: object
          mapping: $.
    - path: /drivers
      name: listdrivers
      operations:
      - method: GET
        name: listdrivers
        description: List drivers
        call: progressive.listdrivers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: progressive-mcp
    transport: http
    description: MCP adapter for Progressive Auto Quote API for AI agent use.
    tools:
    - name: listquotes
      description: List quotes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: progressive.listquotes
      outputParameters:
      - type: object
        mapping: $.
    - name: createquote
      description: Create a quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: progressive.createquote
      outputParameters:
      - type: object
        mapping: $.
    - name: listvehicles
      description: List vehicles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: progressive.listvehicles
      outputParameters:
      - type: object
        mapping: $.
    - name: listdrivers
      description: List drivers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: progressive.listdrivers
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    PROGRESSIVE_TOKEN: PROGRESSIVE_TOKEN
