naftiko: 1.0.0-alpha2
info:
  label: Progressive Auto Quote API — Quotes
  description: 'Progressive Auto Quote API — Quotes. 2 operations. Lead operation: List quotes. Self-contained Naftiko capability
    covering one Progressive business surface.'
  tags:
  - Progressive
  - Quotes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PROGRESSIVE_API_KEY: PROGRESSIVE_API_KEY
capability:
  consumes:
  - type: http
    namespace: auto-quote-quotes
    baseUri: https://api.progressive.com
    description: Progressive Auto Quote API — Quotes business capability. Self-contained, no shared references.
    resources:
    - name: quotes
      path: /quotes
      operations:
      - name: listquotes
        method: GET
        description: List quotes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createquote
        method: POST
        description: Create a quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PROGRESSIVE_API_KEY}}'
  exposes:
  - type: rest
    namespace: auto-quote-quotes-rest
    port: 8080
    description: REST adapter for Progressive Auto Quote API — Quotes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/quotes
      name: quotes
      description: REST surface for quotes.
      operations:
      - method: GET
        name: listquotes
        description: List quotes
        call: auto-quote-quotes.listquotes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createquote
        description: Create a quote
        call: auto-quote-quotes.createquote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: auto-quote-quotes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Progressive Auto Quote API — Quotes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-quotes
      description: List quotes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: auto-quote-quotes.listquotes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-quote
      description: Create a quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: auto-quote-quotes.createquote
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
